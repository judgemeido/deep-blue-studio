  <path d="M350 270h140M710 270h140M960 520v82H240v-82" fill="none" stroke="#76a7df" stroke-width="8" stroke-linecap="round"/>
  <path d="M350 440h140M710 440h140" fill="none" stroke="#d7aa67" stroke-width="8" stroke-linecap="round"/>
