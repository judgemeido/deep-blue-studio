  <g fill="#cbd4c8"><rect x="165" y="270" width="150" height="34"/><rect x="165" y="335" width="150" height="34"/><rect x="165" y="400" width="150" height="34"/><rect x="525" y="270" width="150" height="34"/><rect x="525" y="335" width="150" height="34"/><rect x="525" y="400" width="150" height="34"/><rect x="885" y="270" width="150" height="34"/><rect x="885" y="335" width="150" height="34"/><rect x="885" y="400" width="150" height="34"/></g>
