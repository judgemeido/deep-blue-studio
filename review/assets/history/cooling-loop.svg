  <desc id="desc">原创教学信息图，表现液体从冷却站进入节点并带走热量。</desc>
  <rect width="1200" height="760" fill="#111c27"/>
  <text x="72" y="94" fill="#76a7df" font-family="Georgia,serif" font-size="30">LIQUID LOOP / 30</text>
  <text x="72" y="684" fill="#91a6b1" font-family="Segoe UI,sans-serif" font-size="16" letter-spacing="2">PUMP · PLATE · RETURN · REPEAT</text>
